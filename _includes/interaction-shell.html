<template id="panel-program-carleton"><p class="panel-institution">Carleton University</p><h3>Artificial Intelligence and Machine Learning</h3><p class="panel-meta">Ottawa</p><p>AI and machine learning within a computer science degree, including neural networks and language and vision applications.</p><h4>Industry experience</h4><p>A co-op option is available.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Bachelor of Computer Science stream</dd></div><div><dt>Learner</dt><dd>Undergraduate computer science students</dd></div></dl><p>An undergraduate pathway with technical depth and optional work experience.</p></details><p class="panel-source"><a href="https://admissions.carleton.ca/programs/ai-and-machine-learning/" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-schulich"><p class="panel-institution">York University, Schulich School of Business</p><h3>Master of Management in Artificial Intelligence</h3><p class="panel-meta">Toronto, Keele Campus · 12 months, full-time · In person</p><p>Technical AI foundations alongside business applications and ethical considerations.</p><h4>Industry experience</h4><p>An AI consulting project asks students to work on a client organization’s business problem.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Master’s degree</dd></div><div><dt>Learner</dt><dd>Graduates seeking to combine management with applied AI</dd></div></dl><p>A business-focused benchmark that already includes direct industry engagement.</p></details><p class="panel-source"><a href="https://schulich.yorku.ca/programs/mmai/" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-seneca-aig"><p class="panel-institution">Seneca Polytechnic</p><h3>Artificial Intelligence</h3><p class="panel-meta">Toronto, Newnham Campus · 2 semesters / 8 months · Hybrid</p><p>Applied machine learning, cloud technology, visualization and generative AI.</p><h4>Industry experience</h4><p>An optional work term offers industry exposure. It is separate from the academic semesters.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Ontario College Graduate Certificate</dd></div><div><dt>Learner</dt><dd>Learners with computer science, programming or software development backgrounds</dd></div></dl><p>A short applied pathway building on prior technical preparation.</p></details><p class="panel-source"><a href="https://www.senecapolytechnic.ca/programs/fulltime/AIG.html" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-uoft-scs"><p class="panel-institution">University of Toronto, School of Continuing Studies</p><h3>Artificial Intelligence</h3><p class="panel-meta">Toronto-based provider</p><p>A certificate introducing AI applications and opportunities. Consult the current catalog for course requirements and delivery.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Continuing education certificate</dd></div><div><dt>Learner</dt><dd>Learners developing their understanding of AI and its applications</dd></div></dl><p>A professional-learning comparator with a different audience and credential structure from a Management degree pathway.</p><p class="panel-source"><a href="https://learn.utoronto.ca/curiousu-blog/curiosity/how-scs-integrating-ai-lifelong-learning" target="_blank" rel="noopener noreferrer">Additional official context ↗</a></p></details><p class="panel-source"><a href="https://learn.utoronto.ca/programs-courses/certificates/artificial-intelligence" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-uoft-mscac"><p class="panel-institution">University of Toronto</p><h3>Applied Computing: Artificial Intelligence concentration</h3><p class="panel-meta">Toronto</p><p>Advanced AI study and applied research training.</p><h4>Industry experience</h4><p>Includes an eight-month industrial internship evaluated through academic and industry supervision.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>MScAC concentration</dd></div><div><dt>Learner</dt><dd>Graduates with strong preparation in AI and quantitative study</dd></div></dl><p>A technical graduate benchmark combining advanced coursework and substantial industry experience.</p></details><p class="panel-source"><a href="https://mscac.utoronto.ca/artificial-intelligence/" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-queens"><p class="panel-institution">Queen’s University, Smith School of Business</p><h3>Master of Management in Artificial Intelligence</h3><p class="panel-meta">SmithToronto / HyFlex · 12 months · In person or live online through HyFlex</p><p>AI fluency, business value, responsible adoption and organizational implementation.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Master’s degree</dd></div><div><dt>Learner</dt><dd>Working professionals interested in AI and management</dd></div></dl><p>An example of AI and management education designed to accommodate employment.</p><p class="panel-source"><a href="https://smith.queensu.ca/grad_studies/mmai/landing-page-ai.php" target="_blank" rel="noopener noreferrer">Additional official context ↗</a></p></details><p class="panel-source"><a href="https://smith.queensu.ca/grad_studies/mmai/" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-seneca-mai"><p class="panel-institution">Seneca Polytechnic</p><h3>Master of Artificial Intelligence Design &amp; Development</h3><p class="panel-meta">Toronto, Newnham Campus · Hybrid</p><p>Machine learning, natural language processing, computer vision and AI ethics.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Master’s degree</dd></div><div><dt>Learner</dt><dd>Learners pursuing advanced applied AI design and development</dd></div></dl><p>An applied AI master’s offering. Seneca reported welcoming its first cohort in January 2026.</p><p class="panel-source"><a href="https://www.senecapolytechnic.ca/news-and-events/seneca-news/senecas-historic-new-master-of-artificial-intelligence-design-and-development-program-now-in-session.html" target="_blank" rel="noopener noreferrer">Additional official context ↗</a></p></details><p class="panel-source"><a href="https://www.senecapolytechnic.ca/programs/fulltime/MAI.html" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-durham"><p class="panel-institution">Durham College</p><h3>Artificial Intelligence Analysis, Design &amp; Implementation</h3><p class="panel-meta">Durham Region</p><p>AI systems, machine learning, language processing and the analysis of business data.</p><h4>Industry experience</h4><p>Capstone projects and access to the AI Hub support applied work, including collaboration with industry partners.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Graduate certificate</dd></div><div><dt>Learner</dt><dd>Learners developing applied AI implementation skills</dd></div></dl><p>An applied certificate with an existing connection to business problems and industry.</p></details><p class="panel-source"><a href="https://durhamcollege.ca/programs/artificial-intelligence-analysis-design-and-implementation-graduate-certificate" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-uoft-advanced"><p class="panel-institution">University of Toronto, School of Continuing Studies</p><h3>Advanced Artificial Intelligence</h3><p class="panel-meta">Toronto-based provider</p><p>An advanced AI certificate listed in the school’s catalog. Consult the current catalog for course requirements and delivery.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Continuing education certificate</dd></div><div><dt>Learner</dt><dd>Learners seeking advanced AI study</dd></div></dl><p>A distinct advanced offering within continuing education.</p><p class="panel-source"><a href="https://learn.utoronto.ca/curiousu-blog/curiosity/how-scs-integrating-ai-lifelong-learning" target="_blank" rel="noopener noreferrer">Additional official context ↗</a></p></details><p class="panel-source"><a href="https://learn.utoronto.ca/programs-courses/certificates/advanced-artificial-intelligence" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-tmu"><p class="panel-institution">Toronto Metropolitan University, The Chang School</p><h3>AI for Data</h3><p class="panel-meta">Toronto-based provider</p><p>Effective and ethical use of AI tools to manage, analyze and interpret data in workplace scenarios.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Microcertificate</dd></div><div><dt>Learner</dt><dd>Learners demonstrating workplace AI and data skills</dd></div></dl><p>A focused example of demonstrating practical skills through a smaller credential.</p></details><p class="panel-source"><a href="https://continuing.torontomu.ca/contentManagement.do?code=CM000403&amp;method=load" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-waterloo"><p class="panel-institution">University of Waterloo</p><h3>Master of Data Science and Artificial Intelligence, co-op</h3><p class="panel-meta">Waterloo · 16 months, full-time · On campus</p><p>Advanced data science and artificial intelligence in a professional coursework program.</p><h4>Industry experience</h4><p>The full-time program includes co-operative education.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Master’s degree, co-op</dd></div><div><dt>Learner</dt><dd>Graduates pursuing advanced data science and AI study</dd></div></dl><p>An existing integration of advanced study and work experience.</p></details><p class="panel-source"><a href="https://uwaterloo.ca/future-graduate-students/programs/by-faculty/math/data-science-and-artificial-intelligence-co-op-master-data" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="panel-program-western"><p class="panel-institution">Western University</p><h3>Master of Data Analytics, Artificial Intelligence field</h3><p class="panel-meta">London</p><p>AI specialty courses alongside the data analytics core, plus an Ethics in AI seminar.</p><details class="panel-more"><summary>More program information</summary><dl class="program-facts"><div><dt>Credential</dt><dd>Field within the Master of Data Analytics</dd></div><div><dt>Learner</dt><dd>Learners pursuing data analytics with an AI focus</dd></div></dl><p>An AI field within a broader analytics degree, rather than a separate AI credential.</p></details><p class="panel-source"><a href="https://www.uwo.ca/mda/specialty-fields/artificial-intelligence.html" target="_blank" rel="noopener noreferrer">Official program page ↗</a><br>Checked October 12, 2026</p></template><template id="detail-course-google"><p class="dialog-eyebrow">Example partner: Google</p><h2>Agentic AI with Gemini</h2><p class="concept-note">Illustrative course area. Google participation in this certificate is proposed.</p>
<h4>Tools</h4><p>Google Gemini</p>
<h4>Learning objective</h4><p>Design an AI agent that breaks a business task into steps, uses tools and checks its results.</p>
<h4>Example student assignment</h4><p>Build a Gemini-based agent that gathers information from a supplied business dataset, compares options and drafts a recommendation. Test its tool choices and require human approval before any action.</p>
<h4>Practitioner involvement</h4><p>A practitioner could propose a business task and review the agent’s decisions and performance.</p>
<div class="discussion-note"><h4>Learning across technologies</h4><p>Compare how planning, tool use and evaluation carry across different agent platforms.</p></div><p class="source-line">Official tool information: <a href="https://ai.google.dev/gemini-api/docs/function-calling" target="_blank" rel="noopener noreferrer">Gemini tool use and function calling</a></p></template><template id="detail-course-microsoft"><p class="dialog-eyebrow">Example partner: Microsoft</p><h2>AI agents and workflow automation</h2><p class="concept-note">Illustrative course area. Microsoft participation in this certificate is proposed.</p>
<h4>Tools</h4><p>Microsoft Copilot Studio · Power Automate</p>
<h4>Learning objective</h4><p>Design a workflow that uses AI with explicit operating limits and appropriate human oversight.</p>
<h4>Example student assignment</h4><p>Prototype a service-request workflow. Test routine cases and failures, and identify the points that require human review.</p>
<h4>Practitioner involvement</h4><p>A practitioner could co-teach an applied session and review the workflow design.</p>
<div class="discussion-note"><h4>Learning across technologies</h4><p>Explain which design principles remain useful when the platform or automation tool changes.</p></div><p class="source-line">Official tool information: <a href="https://www.microsoft.com/en-us/copilot/products/copilot-studio" target="_blank" rel="noopener noreferrer">Microsoft Copilot Studio</a> · <a href="https://learn.microsoft.com/power-automate/copilot-overview" target="_blank" rel="noopener noreferrer">Power Automate</a></p></template><template id="detail-course-sas"><p class="dialog-eyebrow">Example partner: SAS</p><h2>Predictive analytics and decision support</h2><p class="concept-note">Illustrative course area. SAS participation in this certificate is proposed.</p>
<h4>Tools</h4><p>SAS Viya</p>
<h4>Learning objective</h4><p>Connect a validated model to a management decision and explain the limits of the evidence.</p>
<h4>Example student assignment</h4><p>Build and validate a prediction model, then recommend a decision rule and explain its likely tradeoffs.</p>
<h4>Practitioner involvement</h4><p>A practitioner could contribute a business case and review the interpretation of results.</p>
<div class="discussion-note"><h4>Learning across technologies</h4><p>Compare a predictive model with a simpler baseline before choosing a more complex solution.</p></div><p class="source-line">Official tool information: <a href="https://www.sas.com/en_us/software/viya.html" target="_blank" rel="noopener noreferrer">SAS Viya</a></p></template>
